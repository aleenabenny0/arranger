[project]
name = "arranger"
version = "0.1.0"
description = "Audio in, playable-for-you sheet music out."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The verifier needs none of this. Keep it that way.
io = ["music21>=9.1", "pretty_midi>=0.2.10"]
audio = ["librosa>=0.10", "basic-pitch>=0.3", "demucs>=4.0"]
agent = ["langgraph>=0.2", "pydantic>=2.7"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
arranger-verify = "arranger.verify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arranger"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
