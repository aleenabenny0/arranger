[project]
name = "arranger"
version = "0.1.0"
description = "Audio in, playable-for-you sheet music out."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The verifier needs none of this. Keep it that way.
io = ["music21>=9.1", "pretty_midi>=0.2.10"]
audio = ["librosa>=0.10", "basic-pitch>=0.3", "demucs>=4.0"]
agent = ["langgraph>=0.2", "pydantic>=2.7"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "pydantic>=2.7", "psycopg[binary]>=3.2", "httpx>=0.28", "resend>=2.13"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
arranger-verify = "arranger.verify.cli:main"
arranger-agent = "arranger.agent:main"
arranger-evaluate = "arranger.evaluate:main"
arranger-api = "arranger_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arranger", "src/arranger_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
