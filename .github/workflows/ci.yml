name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      # Work branches get the same checks before a pull request exists.
      - "chore/**"
      - "feat/**"

permissions:
  contents: read
  security-events: write

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # LilyPond makes the PDF tests real; libsndfile lets the audio tests decode files.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lilypond libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,model,dev]"
          python -m pip install numpy onnxruntime soundfile soxr
          python -m pip install --no-deps basic-pitch

      - name: Fetch the pinned notation engine
        run: python fetch_vendor.py

      - name: Fetch the public-domain evaluation corpus
        run: python fetch_corpus.py

      # The verifier must run with nothing but the standard library.
      - name: Run the constraint tests standalone
        run: python tests/test_constraints.py

      # One pytest run: line coverage gated by fail_under in pyproject.toml, a
      # JUnit file, the ten slowest tests, and up to two reruns of a failing
      # test. A test that passes only on a rerun is listed as flaky in the
      # job summary rather than silently counted as a pass.
      - name: Run the whole test suite
        run: >-
          python -m pytest --cov=src --cov-report=xml:reports/coverage.xml --cov-report=term
          --junitxml=reports/junit.xml --durations=10 --reruns 2 -rRs
          --ignore=tests/test_browser_e2e.py

      - name: Write the quality summary
        if: always()
        run: >-
          python scripts/test_report.py --junit reports/junit.xml --coverage reports/coverage.xml
          --title "Python tests (${{ matrix.python-version }})"

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Run Ruff lint
        run: ruff check .

  browser-tests:
    name: Browser journey and accessibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lilypond

      - name: Install Python dependencies and a browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev,e2e]"
          python -m playwright install --with-deps chromium

      - name: Fetch the notation engine and the accessibility checker
        run: python fetch_vendor.py --dev

      - name: Drive the product through a real browser
        env:
          E2E_SCREENSHOT_DIR: ${{ runner.temp }}/e2e-shots
        run: >-
          python -m pytest tests/test_browser_e2e.py --junitxml=reports/junit-browser.xml
          --durations=10 --reruns 2 -rRs

      - name: Write the quality summary
        if: always()
        run: python scripts/test_report.py --junit reports/junit-browser.xml --title "Browser tests"

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-browser
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
          retention-days: 7

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check frontend JavaScript syntax
        run: |
          for file in frontend/js/*.js; do
            node --check "$file"
          done

      # The content security policy forbids inline script and the app never uses innerHTML.
      - name: Check for patterns the security policy forbids
        run: |
          if grep -nE "innerHTML|outerHTML|insertAdjacentHTML|document\.write|eval\(|new Function" frontend/js/*.js               | grep -vE "^[^:]+:[0-9]+:[[:space:]]*//"; then
            echo "A forbidden DOM or eval pattern is used in the frontend."; exit 1
          fi
          if grep -nE "<script>|onclick=|onload=|javascript:" frontend/*.html; then
            echo "Inline script in an HTML page."; exit 1
          fi

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    env:
      # Snyk runs only when the repository has a SNYK_TOKEN secret; a fork or a
      # fresh clone without one still gets every other scanner.
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # Gitleaks scans the whole history, not just this commit

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the application and the scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,model]"
          python -m pip install bandit pip-audit

      # Static analysis of the source at medium severity and above. False
      # positives carry a `# nosec` with the reason on the same line.
      - name: Bandit
        run: bandit -r src -ll

      - name: pip-audit on the installed environment
        run: pip-audit --skip-editable

      - name: pip-audit on the pinned production dependencies
        run: pip-audit --requirement requirements.lock --no-deps --disable-pip

      - name: Gitleaks on the full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the Snyk CLI
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/setup@master

      - name: Snyk test of the pinned dependencies
        if: env.SNYK_TOKEN != ''
        run: snyk test --file=requirements.lock --package-manager=pip --severity-threshold=high

      - name: Snyk skipped
        if: env.SNYK_TOKEN == ''
        run: echo "::notice title=Snyk::SNYK_TOKEN is not set for this repository, so the Snyk test did not run. Add the secret to enable it."

  postgres-integration:
    name: Postgres integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arranger_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arranger_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"

      # Accounts, then the whole project journey (files as BYTEA, four workers racing
      # for three jobs, account deletion) against a real Postgres server, and the
      # failure-injection proof that every multi-write operation is atomic.
      - name: Run real Postgres storage, project flow and transaction tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arranger_test
        run: >-
          python -m pytest tests/test_postgres_integration.py tests/test_transactions.py
          --junitxml=reports/junit-postgres.xml --durations=10 --reruns 2 -rRs

      - name: Write the quality summary
        if: always()
        run: python scripts/test_report.py --junit reports/junit-postgres.xml --title "Postgres integration"

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-postgres
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  shell-checks:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version

      - name: Lint every shell script
        run: shellcheck --severity=style scripts/*.sh

  docker-build:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs:
      - python-tests
      - frontend-checks
      - security
      - postgres-integration
      - shell-checks

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build deployment image
        run: docker build -t arranger-ci .

      - name: Start the image
        run: |
          docker run -d --name arranger-smoke -p 8000:8000 \
            -e APP_ENV=development -e COOKIE_SECURE=false -e EMAIL_PROVIDER=console arranger-ci

      - name: Wait for /health
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              echo "healthy after $attempt attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error title=Container never answered /health::$(docker logs arranger-smoke 2>&1 | tail -n 40 | tr '\n' ' ' | cut -c1-3500)"
          exit 1

      # The same script an operator runs against staging: health, readiness,
      # register, sign in, list profiles, sign out, and the capabilities the
      # full image promises (PDF engraving and audio import).
      - name: Run the smoke test
        env:
          SMOKE_CAPABILITIES: export_pdf,import_audio
        run: bash scripts/smoke.sh http://127.0.0.1:8000 | tee smoke.log

      - name: Check the image itself
        run: |
          curl --fail --silent --output /dev/null "http://127.0.0.1:8000/vendor/verovio-toolkit-wasm.js"
          test "$(docker exec arranger-smoke id -u)" != "0"

      # A passive OWASP ZAP baseline scan of the running image: it spiders the
      # site and reports missing headers, cookie flags, information leaks and
      # the like. Accepted findings are listed with their reasons in
      # .zap/rules.tsv; anything else fails the job.
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:8000
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      # Plugin id, name, risk and count of every alert, so a new finding can be
      # matched to a rule in .zap/rules.tsv without opening the report artifact.
      - name: Show the ZAP findings as annotations
        if: always()
        run: |
          if [ -f report_json.json ]; then
            python3 - <<'PY'
          import json
          data = json.load(open("report_json.json"))
          lines = []
          for site in data.get("site", []):
              for alert in site.get("alerts", []):
                  lines.append(f"[{alert.get('pluginid')}] {alert.get('alert')} ({alert.get('riskdesc')}) x{alert.get('count')}")
          print("::warning title=ZAP alerts::" + (" | ".join(lines)[:3500] or "none"))
          PY
          else
            echo "::warning title=ZAP::no report_json.json was written"
          fi

      # Annotations can be read from the run page and the API without the log.
      - name: Explain the failure
        if: failure()
        run: |
          if [ -f smoke.log ]; then
            echo "::error title=Smoke test::$(grep -E '^(FAIL|[0-9]+ check)' smoke.log | tr '\n' ' ' | cut -c1-3500)"
          fi
          echo "::error title=Container log tail::$(docker logs arranger-smoke 2>&1 | tail -n 60 | tr '\n' ' ' | cut -c1-3500)"
          docker logs arranger-smoke || true

  kubernetes:
    name: Kubernetes deployment (kind)
    runs-on: ubuntu-latest
    needs:
      - docker-build

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # A real, single-node Kubernetes cluster on the runner.
      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: arranger

      - name: Build the image
        run: docker build -t arranger:local .

      - name: Load the image into the cluster
        run: kind load docker-image arranger:local --name arranger

      - name: Deploy
        run: |
          kubectl apply -f k8s/
          kubectl -n arranger rollout status statefulset/postgres --timeout=120s
          kubectl -n arranger rollout status deployment/arranger --timeout=120s
          kubectl -n arranger get pods -o wide

      # The same smoke test the Docker job runs, through a port-forward to the Service.
      - name: Smoke test through a port-forward
        env:
          SMOKE_CAPABILITIES: export_pdf,import_audio
        run: |
          kubectl -n arranger port-forward service/arranger 8000:80 > port-forward.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 2
          done
          bash scripts/smoke.sh http://127.0.0.1:8000 | tee smoke.log

      - name: Describe the cluster on failure
        if: failure()
        run: |
          kubectl -n arranger get pods -o wide || true
          kubectl -n arranger describe pods || true
          kubectl -n arranger logs deployment/arranger --all-containers --tail=200 || true
          kubectl -n arranger logs statefulset/postgres --tail=100 || true
          cat port-forward.log 2>/dev/null || true
          echo "::error title=Kubernetes pods::$(kubectl -n arranger get pods 2>&1 | tr '\n' ' ' | cut -c1-1500)"
          echo "::error title=Kubernetes events::$(kubectl -n arranger get events --sort-by=.lastTimestamp 2>&1 | tail -n 25 | tr '\n' ' ' | cut -c1-3500)"
          echo "::error title=Kubernetes app log::$(kubectl -n arranger logs deployment/arranger --all-containers --tail=60 2>&1 | tr '\n' ' ' | cut -c1-3500)"
          if [ -f smoke.log ]; then
            echo "::error title=Kubernetes smoke test::$(grep -E '^(FAIL|[0-9]+ check)' smoke.log | tr '\n' ' ' | cut -c1-3000)"
          fi

  production-smoke:
    name: Production smoke check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs:
      - docker-build

    steps:
      - name: Check production endpoints
        env:
          APP_PUBLIC_URL: https://arranger-production-8928.up.railway.app
        run: |
          curl --fail --show-error --silent "$APP_PUBLIC_URL/health"
          curl --fail --show-error --silent "$APP_PUBLIC_URL/ready"
          curl --fail --show-error --silent "$APP_PUBLIC_URL/version"
          curl --fail --show-error --silent "$APP_PUBLIC_URL/diagnostics/email"
