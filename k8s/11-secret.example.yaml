# Placeholder secrets. `kubectl apply -f k8s/` applies this file too, which is
# what the CI kind cluster relies on; for anything real, copy it to
# k8s/secret.yaml (git-ignored), replace every value, and apply that file
# after the directory so it overwrites this one:
#
#   cp k8s/11-secret.example.yaml k8s/secret.yaml
#   kubectl apply -f k8s/ && kubectl apply -f k8s/secret.yaml
#   kubectl -n arranger rollout restart deployment/arranger statefulset/postgres
#
# The Postgres pod and the API pods both read this Secret: POSTGRES_* creates
# the database, DATABASE_URL must name the same user, password and database.
apiVersion: v1
kind: Secret
metadata:
  name: arranger-secrets
  namespace: arranger
type: Opaque
stringData:
  POSTGRES_USER: "arranger"
  POSTGRES_PASSWORD: "change-me-before-any-real-use"
  POSTGRES_DB: "arranger"
  DATABASE_URL: "postgresql://arranger:change-me-before-any-real-use@postgres:5432/arranger"
  # Required when EMAIL_PROVIDER=resend; empty otherwise.
  RESEND_API_KEY: ""
  # Bearer token for GET /metrics and GET /diagnostics/email; empty disables both.
  METRICS_TOKEN: ""
