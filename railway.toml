[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[variables]
APP_ENV = "production"
LOG_LEVEL = "INFO"
APP_PUBLIC_URL = "https://arranger-production-8928.up.railway.app"
HOST = "0.0.0.0"
RELOAD = "false"
COOKIE_SECURE = "true"
SESSION_DAYS = "30"
MAX_SESSIONS_PER_USER = "5"
CSRF_PROTECTION = "true"
RATE_LIMIT_REQUESTS = "120"
RATE_LIMIT_WINDOW_SECONDS = "60"
MAX_REQUEST_BYTES = "1000000"
PASSWORD_RESET_MINUTES = "30"
EMAIL_PROVIDER = "resend"
PASSWORD_RESET_FROM = "Arranger <onboarding@resend.dev>"
PASSWORD_RESET_SUBJECT = "Reset your Arranger password"
FRONTEND_ORIGINS = "https://arranger-production-8928.up.railway.app"
FRONTEND_DIR = "/app/frontend"
