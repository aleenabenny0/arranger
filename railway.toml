[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[variables]
APP_ENV = "production"
HOST = "0.0.0.0"
RELOAD = "false"
COOKIE_SECURE = "true"
FRONTEND_DIR = "/app/frontend"
